<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seite nicht gefunden — SolarExplorer</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", sans-serif;
      color: #e8ecff;
      background: radial-gradient(circle at 50% 20%, #1b2350 0%, #05060f 70%);
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 0.5rem; }
    p { font-size: 1.15rem; line-height: 1.6; color: #b9c1e8; max-width: 34rem; }
    .planet {
      width: 5rem; height: 5rem; border-radius: 50%; margin: 0 auto 1.5rem;
      background: radial-gradient(circle at 32% 30%, #ffd98a, #e0761f 60%, #6b2c05);
      box-shadow: 0 0 40px rgba(255, 180, 90, 0.45);
    }
    a {
      display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.5rem;
      border-radius: 999px; background: #4f6cff; color: #fff; text-decoration: none;
      font-weight: 600;
    }
    a:hover, a:focus-visible { background: #6b83ff; }
  </style>
</head>
<body>
  <main>
    <div class="planet" aria-hidden="true"></div>
    <h1>404</h1>
    <p>Diese Seite gibt es im Weltall nicht. Vielleicht hast du dich verirrt —
       der Weg fuehrt zurueck zum Sonnensystem.</p>
    <a href="/">Zurueck zum Start</a>
  </main>
</body>
</html>
