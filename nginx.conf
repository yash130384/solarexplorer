server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------
    # Kompression: nur Textformate, keine Bilder/Video (lohnt nicht).
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------
    # Security-Header
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------
    # Cache-Header
    # ---------------------------------------------------------------
    # Vite hashed Assets -> immutable, 1 Jahr.
    # "expires" bleibt bewusst weg: es wuerde ein zweites, redundantes
    # Cache-Control-Header erzeugen.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Texturen und andere statische Dateien: eine Woche Cache
    location ~* \.(?:png|jpe?g|webp|avif|gif|ico|svg|woff2?|glb|gltf|bin|ktx2)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # HTML nie cachen, damit neue Releases sofort sichtbar sind
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # 404-Seite
    # ---------------------------------------------------------------
    # SolarExplorer ist eine Vanilla-DOM-App ohne Client-Router: es gibt
    # keine Route, die per Deep-Link aufgerufen werden koennte. Deshalb wird
    # bewusst NICHT auf /index.html zurueckgefallen — ein unbekannter Pfad
    # liefert die 404-Seite statt eines scheinbar passenden HTML-Dokuments.
    error_page 404 /404.html;

    # bewusst ohne "internal": /404.html muss auch direkt abrufbar sein
    location = /404.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Statisch ausgelieferte App: existiert der Pfad nicht, greift die
    # 404-Seite (Status 404, nicht 500).
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.[^/]+$ {
        deny all;
    }
}
